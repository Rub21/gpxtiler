name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: gpxtiler
          POSTGRES_PASSWORD: gpxtiler
          POSTGRES_DB: gpxtiler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpxtiler"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GPXTILER_TEST_DB: postgres://gpxtiler:gpxtiler@localhost:5432/gpxtiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 ./...
