# Run gpxtiler on a server: PostGIS, the two updates and the tile server.
#
#   cp .env.example .env        # set the URLs and the password
#   docker compose -f compose.server.yaml up -d db
#   docker compose -f compose.server.yaml run --rm import       # once
#   docker compose -f compose.server.yaml run --rm render-all   # once: low zoom tiles
#   docker compose -f compose.server.yaml up -d
#   docker compose -f compose.server.yaml logs -f update-rss update-ids
#
# PNG tiles:    http://localhost:${GPXTILER_PORT:-8080}/lines/{z}/{x}/{y}.png
# Vector tiles: http://localhost:${GPXTILER_VT_PORT:-8081}/gps/tilejson.json
name: gpxtiler-server
x-gpxtiler: &gpxtiler
  build: .
  image: gpxtiler
  restart: unless-stopped
  environment:
    GPXTILER_DB: postgres://gpxtiler:${POSTGRES_PASSWORD:-gpxtiler}@db:5432/gpxtiler
    GPXTILER_SITE: ${GPXTILER_SITE:-https://www.openstreetmap.org}
    GPXTILER_EXPIRE_DIR: /data/expire
    GPXTILER_TILE_DIR: /data/tiles
    GPXTILER_DUMP: ${GPXTILER_DUMP:-}
    GPXTILER_IDS: ${GPXTILER_IDS:-}
    GPXTILER_RSS_EVERY: ${GPXTILER_RSS_EVERY:-300}
    GPXTILER_IDS_EVERY: ${GPXTILER_IDS_EVERY:-86400}
    GPXTILER_EXPIRE_MIN_ZOOM: ${GPXTILER_EXPIRE_MIN_ZOOM:-0}
    GPXTILER_EXPIRE_MAX_ZOOM: ${GPXTILER_EXPIRE_MAX_ZOOM:-14}
    GPXTILER_COLORS: ${GPXTILER_COLORS:-64}
    GPXTILER_LOW_ZOOMS: ${GPXTILER_LOW_ZOOMS:-5,8,11}
    GPXTILER_PRE_ZOOM: ${GPXTILER_PRE_ZOOM:-9}
    GPXTILER_CACHE_ZOOM: ${GPXTILER_CACHE_ZOOM:-14}
    GPXTILER_RENDER_EVERY: ${GPXTILER_RENDER_EVERY:-300}
    GPXTILER_RENDER_MIN_ZOOM: ${GPXTILER_RENDER_MIN_ZOOM:-6}
    GPXTILER_RENDER_LOW_EVERY: ${GPXTILER_RENDER_LOW_EVERY:-86400}
  volumes:
    - ./data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpxtiler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpxtiler}
      POSTGRES_DB: gpxtiler
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpxtiler"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Load the dump once: docker compose -f compose.server.yaml run --rm import
  import:
    <<: *gpxtiler
    restart: "no"
    entrypoint: ["sh", "-c", "gpxtiler import \"$$GPXTILER_DUMP\""]
    profiles: ["import"]

  # PNG tiles on /lines/{z}/{x}/{y}.png. Zooms up to PRE_ZOOM come from
  # /data/tiles (made by render), up to CACHE_ZOOM are cached there.
  serve:
    <<: *gpxtiler
    command: ["serve", "-listen", ":8080"]
    ports:
      - "${GPXTILER_PORT:-8080}:8080"

  # Draw all the low zoom tiles once: docker compose -f compose.server.yaml run --rm render-all
  render-all:
    <<: *gpxtiler
    restart: "no"
    command: ["render", "-all"]
    profiles: ["import"]

  # Apply the expire files every few minutes: redraw the pre-rendered tiles
  # from RENDER_MIN_ZOOM up, and drop the expired tiles from the cache.
  render-expire:
    <<: *gpxtiler
    entrypoint: ["sh", "-c", "while true; do gpxtiler render -min-zoom $$GPXTILER_RENDER_MIN_ZOOM; sleep $$GPXTILER_RENDER_EVERY; done"]

  # Redraw all the low zoom tiles once a day, so deleted traces leave the
  # zooms below RENDER_MIN_ZOOM too.
  render-low:
    <<: *gpxtiler
    entrypoint: ["sh", "-c", "while true; do sleep $$GPXTILER_RENDER_LOW_EVERY; gpxtiler render -all; done"]

  # Vector tiles (MVT) with Tilekiln, drawn on the fly from the same tables.
  # "serve dev" has no tile storage; it is enough to try the tiles.
  tilekiln:
    build: tilekiln
    image: gpxtiler-tilekiln
    restart: unless-stopped
    command: ["serve", "dev", "--config", "/config/config.yaml",
              "--bind-host", "0.0.0.0", "--bind-port", "8000",
              "--source-host", "db", "--source-dbname", "gpxtiler", "--source-username", "gpxtiler",
              "--base-url", "http://localhost:${GPXTILER_VT_PORT:-8081}"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-gpxtiler}
    volumes:
      - ./tilekiln:/config:ro
    ports:
      - "${GPXTILER_VT_PORT:-8081}:8000"
    depends_on:
      db:
        condition: service_healthy

  # New traces from the RSS feed, every few minutes.
  update-rss:
    <<: *gpxtiler
    entrypoint: ["sh", "-c", "while true; do gpxtiler update -rss; sleep $$GPXTILER_RSS_EVERY; done"]

  # Deleted traces from the id list, once a day.
  update-ids:
    <<: *gpxtiler
    entrypoint: ["sh", "-c", "while true; do gpxtiler update -ids \"$$GPXTILER_IDS\"; sleep $$GPXTILER_IDS_EVERY; done"]

volumes:
  db-data:
